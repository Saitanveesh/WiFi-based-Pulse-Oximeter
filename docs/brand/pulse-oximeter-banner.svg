<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">WiFi Pulse Oximeter — ESP8266, MAX30100, OLED, Blynk</title>
<desc id="desc">System diagram of an educational prototype. MAX30100 optical sensor connects by I2C to an ESP8266, which provides a local OLED display and optional Wi-Fi telemetry to a Blynk dashboard. No clinical or measured values are shown.</desc>
